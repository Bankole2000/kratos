# pnpm workspace for every JS/TS package (ADR-001). Folders without a
# package.json (such as the Rust crate packages/types) are ignored.
packages:
  - apps/web
  - apps/app
  - packages/*
  - sdks/ts

# Shared versions for the Vue packages and apps (`"vue": "catalog:"` in a package.json),
# so web, app and ui always resolve the same Vue, Vuetify and test tooling.
catalog:
  vue: 3.5.46
  vuetify: 4.3.4
  typescript: 7.0.2
  vitest: 5.1.1
  '@vue/test-utils': 2.6.0
  happy-dom: 21.0.4

# Dependency install scripts that pnpm may run. esbuild (pulled in by Nuxt) only uses its
# postinstall to check its platform binary, which pnpm already installs; skip it.
allowBuilds:
  esbuild: false
