# pnpm workspace for every JS/TS package (ADR-001). Folders without a
# package.json (such as the Rust crate packages/types) are ignored.
packages:
  - apps/web
  - apps/app
  - packages/*
  - sdks/ts
# Dependency install scripts that pnpm may run. esbuild (pulled in by Nuxt) only uses its
# postinstall to check its platform binary, which pnpm already installs; skip it.
allowBuilds:
  esbuild: false
