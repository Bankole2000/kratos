# Local development only: Postgres for apps/api (README, Local development).
# Start with `docker compose up -d`, stop with `docker compose stop`. Data is kept in the
# named volume `postgres-data`; `docker compose down -v` deletes it.
#
# Fixed project name, so the container and volume are the same whichever folder (clone or
# worktree) you run this from.
name: platform-core

services:
  postgres:
    image: postgres:17
    environment:
      # Database created on first start; DATABASE_URL in .env.example points at it.
      POSTGRES_DB: platform_core
      # Trust auth: no password, so nothing secret-looking is committed. This is for local
      # development only, never for staging or production. The port below is published on
      # 127.0.0.1 only, so other machines on the network cannot connect.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'platform_core']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
