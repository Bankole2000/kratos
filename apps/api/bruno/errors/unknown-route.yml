info:
  name: Unknown route returns not_found
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/this-route-does-not-exist"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.error.code
      operator: eq
      value: not_found
    - expression: res.body.error.message
      operator: isString
  scripts:
    - type: tests
      code: |-
        test("error.request_id equals the X-Request-Id header", function () {
          const header = res.headers["x-request-id"];
          expect(header).to.be.a("string").and.not.be.empty;
          expect(res.body.error.request_id).to.equal(header);
        });

docs:
  content: Not in the spec. Checks the standard error body for a route that does not exist.
  type: text/markdown
